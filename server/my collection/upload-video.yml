info:
  name: Upload Video
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:5000/api/upload/video
  body:
    type: json
    data: |-
       {
          "filePath": "/tmp/video.mp4",
          "publicId": "optional-public-id"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
